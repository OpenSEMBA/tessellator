name: "Build and test"

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env: 
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  
jobs:
  builds-and-tests:
    strategy:
      matrix:
        preset: [
          {"os": windows-2022, "name": "msbuild"},
          {"os": ubuntu-latest, "name": "gnu"},
          {"os": ubuntu-latest, "name": "gnu-cgal"}
        ]
        build-type: ["Release"]
        
      fail-fast: false
        
    name: ${{ matrix.preset.os }} / ${{matrix.preset.name}} / ${{matrix.build-type}}
    runs-on: ${{ matrix.preset.os }}
    env:
      VCPKG_BINARY_SOURCES: clear

    steps:
    - name: checkout repository
      uses: actions/checkout@v3

    - name: setup ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: getcmake
      uses: lukka/get-cmake@latest

    # - name: Setup upterm session
    #   uses: lhotari/action-upterm@v1

    # I am having issues installing vcpkg in ubuntu.
    - name: Setup vtk in ubuntu
      if: matrix.preset.os=='ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libvtk9-dev

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Setup vcpkg 
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: eed289f6e06a5e7a5c9e6a729671b0a56af7dd69
    
    - name: Windows configure and build
      if: matrix.preset.name=='msbuild'
      run: |
        $configured = $false
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          cmake --preset ${{matrix.preset.name}} -S . -B build
          if ($LASTEXITCODE -eq 0) {
            $configured = $true
            break
          }
          if ($attempt -lt 3) {
            Write-Host "Configure failed (attempt $attempt/3). Retrying in 20 seconds..."
            Start-Sleep -Seconds 20
          }
        }
        if (-not $configured) { exit 1 }
        cmake --build build --config ${{matrix.build-type}} -j

    - name: Windows Run tests
      if: matrix.preset.name=='msbuild'
      run: build/bin/${{matrix.build-type}}/tessellator_tests.exe

    - name: Ubuntu configure and build
      if: matrix.preset.os=='ubuntu-latest'
      run: |
        configured=0
        for attempt in 1 2 3; do
          cmake --preset ${{matrix.preset.name}} -S . -B build && configured=1 && break
          if [ "$attempt" -lt 3 ]; then
            echo "Configure failed (attempt $attempt/3). Retrying in 20 seconds..."
            sleep 20
          fi
        done
        [ "$configured" -eq 1 ] || exit 1
        cmake --build build -j
        
    - name: Ubuntu Run tests
      if: matrix.preset.os=='ubuntu-latest'
      run: build/bin/tessellator_tests
