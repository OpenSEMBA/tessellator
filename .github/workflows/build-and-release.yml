name: Build and release

on:
  push:
    branches:
      - main
      - 66-release-issues

permissions:
  contents: write

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  WINDOWS_FILENAME: opensemba-tessellator-windows-x64.tar.gz
  LINUX_FILENAME: opensemba-tessellator-linux-x64.tar.gz

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.release.outputs.date }}
      short-sha: ${{ steps.release.outputs.short-sha }}
    steps:
      - id: release
        shell: bash
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: release-info
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: gnu
            platform: ubuntu-gnu
            archive: opensemba-tessellator-linux-x64.tar.gz
          - os: windows-2022
            preset: msbuild
            platform: windows-msbuild
            archive: opensemba-tessellator-windows-x64.tar.gz

    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Install Ubuntu VTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvtk9-dev

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: eed289f6e06a5e7a5c9e6a729671b0a56af7dd69

      - name: Configure and build
        run: |
          cmake --preset ${{ matrix.preset }} -S . -B build
          cmake --build build --config Release -j

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Create release archive
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            archive_root="opensemba-tessellator-windows-x64"
            cmake \
              -DTESSELLATOR_EXECUTABLE="${PWD}/build/bin/Release/tessellator.exe" \
              -DTESSELLATOR_RUNTIME_DIRECTORY="${PWD}/build/vcpkg_installed/x64-windows/bin" \
              -DTESSELLATOR_STAGING_DIRECTORY="${PWD}/release/${archive_root}" \
              -DTESSELLATOR_LICENSE="${PWD}/LICENSE" \
              -DTESSELLATOR_README="${PWD}/README.md" \
              -P .github/scripts/package-windows-release.cmake
            tar -czvf "${{ matrix.archive }}" -C release "${archive_root}"
          else
            binary="build/bin/tessellator"
            tar -czvf "${{ matrix.archive }}" "$binary" LICENSE
          fi

      - name: Verify Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extractDir = Join-Path $PWD 'release-check'
          New-Item -ItemType Directory -Path $extractDir | Out-Null
          tar -xzf '${{ matrix.archive }}' -C $extractDir
          $bundleDir = Join-Path $extractDir 'opensemba-tessellator-windows-x64'
          foreach ($requiredFile in @('tessellator.exe', 'LICENSE', 'README.md')) {
            if (-not (Test-Path (Join-Path $bundleDir $requiredFile))) {
              throw "Release archive is missing $requiredFile"
            }
          }
          & (Join-Path $bundleDir 'tessellator.exe') -h
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-info.outputs.date }}-${{ needs.release-info.outputs.short-sha }}-${{ matrix.platform }}
          name: OpenSemba Tessellator ${{ matrix.platform }} release
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ matrix.archive }}
